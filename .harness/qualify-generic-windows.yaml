pipeline:
  name: qTest Publisher - Generic Tag Windows Qualification-dm
  identifier: qtest_publisher_qualify_generic_windows_dm
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: dmgitcon
        repoName: qtest-plugin-images
        build: <+input>
  variables:
    - {name: dockerConnector, type: String, value: dmdockerconn}
    - {name: namespace, type: String, value: cie-test}
    - {name: candidateTag, type: String, value: <+input>}
    - {name: expectedIndexDigest, type: String, value: <+input>}
    - {name: qtestUrl, type: String, value: <+input>}
    - {name: qtestToken, type: Secret, value: <+input>}
    - {name: qtestProjectId, type: String, value: <+input>}
    - {name: qtestCycleId, type: String, value: <+input>}
  stages:
    - stage:
        name: Validate generic candidate index
        identifier: validate_generic_candidate_index
        type: CI
        spec:
          cloneCodebase: true
          platform: {os: Linux, arch: Amd64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
              - step:
                  type: Run
                  name: Match tag index to published digest lock
                  identifier: match_tag_index_to_lock
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: docker.io/library/python:3.13.7-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
                    shell: Sh
                    envVariables:
                      CANDIDATE_TAG: <+pipeline.variables.candidateTag>
                      EXPECTED_INDEX_DIGEST: <+pipeline.variables.expectedIndexDigest>
                    command: |
                      set -eu
                      python3 scripts/release.py validate-lock
                      python3 - <<'PY'
                      import json
                      import os
                      import re
                      import urllib.request

                      candidate = os.environ["CANDIDATE_TAG"].removeprefix("docker.io/")
                      expected_index = os.environ["EXPECTED_INDEX_DIGEST"]
                      if "@" in candidate or ":" not in candidate:
                          raise SystemExit("candidate must be the exact generic tag, not a digest")
                      if not re.fullmatch(r"sha256:[0-9a-f]{64}", expected_index):
                          raise SystemExit("invalid expected index digest")
                      repository, tag = candidate.rsplit(":", 1)
                      token_url = (
                          "https://auth.docker.io/token?service=registry.docker.io"
                          f"&scope=repository:{repository}:pull"
                      )
                      with urllib.request.urlopen(token_url, timeout=30) as response:
                          token = json.load(response)["token"]
                      request = urllib.request.Request(
                          f"https://registry-1.docker.io/v2/{repository}/manifests/{tag}",
                          headers={
                              "Authorization": f"Bearer {token}",
                              "Accept": (
                                  "application/vnd.docker.distribution.manifest.list.v2+json,"
                                  "application/vnd.oci.image.index.v1+json"
                              ),
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          observed_index = response.headers["Docker-Content-Digest"]
                          index = json.load(response)
                      if observed_index != expected_index:
                          raise SystemExit(
                              f"generic tag digest mismatch: {observed_index} != {expected_index}"
                          )
                      lock = json.load(open("locks/platform-child-digests.json"))
                      catalog = json.load(open("catalog/versions.yaml"))
                      expected = {}
                      for name, child in lock["children"].items():
                          platform = catalog["platforms"][name]
                          descriptor = {
                              "os": "windows" if name.startswith("windows-") else "linux",
                              "architecture": "arm64" if name == "linux-arm64" else "amd64",
                          }
                          if name.startswith("windows-"):
                              descriptor["os.version"] = platform["os_version"]
                          expected[child["digest"]] = descriptor
                      observed = {
                          item["digest"]: item["platform"] for item in index["manifests"]
                      }
                      if observed != expected:
                          raise SystemExit("generic tag descriptors do not match the digest lock")
                      print(f"Verified generic candidate index: {candidate}@{observed_index}")
                      PY
    - stage:
        name: Qualify generic tag on Windows LTSC 2019
        identifier: qualify_generic_windows_ltsc2019
        type: CI
        spec:
          cloneCodebase: false
          platform: {os: Windows, arch: Amd64}
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: gcopdmwindowsbuildfarm
              namespace: <+pipeline.variables.namespace>
              os: Windows
              nodeSelector:
                kubernetes.io/os: windows
                node.kubernetes.io/windows-build: "10.0.17763"
              tolerations:
                - {effect: NoSchedule, key: node.kubernetes.io/os, operator: Equal, value: windows}
          execution:
            steps:
              - step:
                  type: Run
                  name: Plant JUnit fixture
                  identifier: plant_junit_fixture
                  timeout: 30m
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: harness/ci-base:ltsc2019-r1
                    shell: Powershell
                    command: |
                      $ErrorActionPreference = 'Stop'
                      $path = 'C:\harness\qtest\junit\TEST-CalcTest.xml'
                      New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
                      @'
                      <?xml version="1.0" encoding="UTF-8"?>
                      <testsuite name="publisher.contract" tests="4" failures="1" errors="1" skipped="1" time="0.4" timestamp="2026-10-06T00:00:00Z">
                        <testcase classname="io.harness.qtest.PublisherContract" name="publishes passed results" time="0.1"/>
                        <testcase classname="io.harness.qtest.PublisherContract" name="publishes failures" time="0.1">
                          <failure message="expected failure">assertion details</failure>
                        </testcase>
                        <testcase classname="io.harness.qtest.PublisherContract" name="publishes errors" time="0.1">
                          <error message="expected error">exception details</error>
                        </testcase>
                        <testcase classname="io.harness.qtest.PublisherContract" name="publishes skipped results" time="0.1">
                          <skipped message="expected skip"/>
                        </testcase>
                        <system-out>qTest publisher contract stdout</system-out>
                        <system-err>qTest publisher contract stderr</system-err>
                      </testsuite>
                      '@ | Set-Content -LiteralPath $path -Encoding UTF8
                      Get-Item -LiteralPath $path | Select-Object FullName, Length
              - step:
                  type: Plugin
                  name: Publish sandbox JUnit through generic tag
                  identifier: publish_sandbox_junit_generic_tag
                  timeout: 20m
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: <+pipeline.variables.candidateTag>
                    settings:
                      qtest_url: <+pipeline.variables.qtestUrl>
                      bearer_token: <+pipeline.variables.qtestToken>
                      project_id: <+pipeline.variables.qtestProjectId>
                      destination_type: test-cycle
                      destination_id: <+pipeline.variables.qtestCycleId>
                      suite_name: qtest-qualification-generic-windows-ltsc2019
                      reuse_suite: "true"
                      result_paths: qtest/junit/*.xml
                      identity_mode: class
