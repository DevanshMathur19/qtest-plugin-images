pipeline:
  name: qTest Publisher - Publish Platform Candidates-dm
  identifier: qtest_publisher_publish_candidates_dm
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: dmgitcon
        repoName: qtest-publisher
        build: <+input>
  variables:
    - {name: dockerConnector, type: String, value: dmdockerconn}
    - {name: windows2019BuilderPool, type: String, value: windows-2019}
    - {name: windows2025BuilderPool, type: String, value: windows-2025}
    - {name: goWindowsUrl, type: String, value: "https://go.dev/dl/go1.26.9.windows-amd64.zip"}
    - {name: goWindowsSha256, type: String, value: "d722201a9c0c086d1610e111c48203009af690892ed708072bd5ae20160e7a59"}
  stages:
    - stage:
        name: Validate source
        identifier: validate_source
        type: CI
        spec:
          cloneCodebase: true
          platform: {os: Linux, arch: Amd64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
              - step:
                  type: Run
                  name: Unit race vet and cross-build
                  identifier: unit_race_vet_cross_build
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: docker.io/library/golang:1.26.9-alpine@sha256:397ecc648150dd585f1734dfcd8d1bb4746664e54464191d77ad0ecffaf38bdb
                    shell: Sh
                    command: |
                      set -eu
                      apk add --no-cache build-base git python3
                      git cat-file -e 0b2e70d1b468efdbe249ee1a72536c6d161414d1^{commit}
                      git diff --exit-code 0b2e70d1b468efdbe249ee1a72536c6d161414d1 -- go.mod main.go plugin
                      cat <<'CHECKSUMS' | sha256sum -c -
                      efb720eedc232dc9fa21b812f29ba87696322d9d04b4c94c4f8a9a3f6ecc335c  docker/Dockerfile.linux.amd64
                      0cb5752b1d26453d4efd9ea420872c008dc479af47703819f90162ca1c8b066d  docker/Dockerfile.linux.arm64
                      bd84fedea8341f032b300dd969de65f5c9e001764136fc928d602fe7f239b146  docker/Dockerfile.windows.amd64.ltsc2019
                      bb09678d7776035bdcd4cfeacd52be5b0ffbda225b2f26edc6c15edc81c3f962  docker/Dockerfile.windows.amd64.ltsc2022
                      36c46d7e96d2f42a54d38cb23bbf278d3838aabf562cdae5e0139c02db6d1f86  docker/Dockerfile.windows.amd64.ltsc2025
                      0b3c226f631703b76cafd4bb7bb1a15cc8f3b068f65b43a274dd66b264ee6ee7  docker/manifest.tmpl
                      CHECKSUMS
                      test "$(go env GOVERSION)" = go1.26.9
                      go test ./...
                      go test -race ./...
                      go vet ./...
                      go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
                      go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
                      test -z "$(go list -deps -f '{{if and (not .Standard) (ne .Module.Path "github.com/harness-community/qtest-publisher")}}{{.ImportPath}}{{end}}' ./...)"
                      for target in linux/amd64 linux/arm64 windows/amd64; do
                        GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath ./...
                      done
                      python3 - <<'PY'
                      import json
                      import urllib.error
                      import urllib.request

                      repository = "devanshmathur19/qtest-publisher"
                      tags = [
                          "1.0.1-linux-amd64-r2",
                          "1.0.1-linux-arm64-r2",
                          "1.0.1-windows-ltsc2019-amd64-r2",
                          "1.0.1-windows-ltsc2022-amd64-r2",
                          "1.0.1-windows-ltsc2025-amd64-r2",
                      ]
                      token_url = (
                          "https://auth.docker.io/token?service=registry.docker.io"
                          f"&scope=repository:{repository}:pull"
                      )
                      with urllib.request.urlopen(token_url, timeout=30) as response:
                          token = json.load(response)["token"]
                      for tag in tags:
                          request = urllib.request.Request(
                              f"https://registry-1.docker.io/v2/{repository}/manifests/{tag}",
                              method="HEAD",
                              headers={
                                  "Authorization": f"Bearer {token}",
                                  "Accept": "application/vnd.docker.distribution.manifest.v2+json",
                              },
                          )
                          try:
                              with urllib.request.urlopen(request, timeout=30):
                                  raise SystemExit(f"refusing to overwrite immutable tag: {tag}")
                          except urllib.error.HTTPError as error:
                              if error.code != 404:
                                  raise
                      PY
              - step:
                  type: Run
                  name: Secret scan
                  identifier: secret_scan
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: docker.io/zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
                    shell: Sh
                    command: gitleaks detect --source . --no-git --redact
    - parallel:
        - stage:
            name: Publish Linux AMD64
            identifier: publish_linux_amd64
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "tag"
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Linux, arch: Amd64}
              runtime: {type: Cloud, spec: {}}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build static binary
                      identifier: build_static_binary
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: docker.io/library/golang:1.26.9-alpine@sha256:397ecc648150dd585f1734dfcd8d1bb4746664e54464191d77ad0ecffaf38bdb
                        shell: Sh
                        command: |
                          set -eu
                          mkdir -p release/linux/amd64
                          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
                            -ldflags="-s -w -X main.version=1.0.1+<+codebase.shortCommitSha>" \
                            -o release/linux/amd64/qtest-publisher .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish immutable child
                      identifier: publish_immutable_child
                      timeout: 30m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/qtest-publisher
                        tags: [1.0.1-linux-amd64-r2]
                        dockerfile: docker/Dockerfile.linux.amd64
                        context: .
                        caching: false
        - stage:
            name: Publish Linux ARM64
            identifier: publish_linux_arm64
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "tag"
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Linux, arch: Arm64}
              runtime: {type: Cloud, spec: {}}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build static binary
                      identifier: build_static_binary
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: docker.io/library/golang:1.26.9-alpine@sha256:dccc7a8faa4dbaabed38c2ebb7a7bd24c342f2b0ee0fc1a0d2bd41b0243513ad
                        shell: Sh
                        command: |
                          set -eu
                          mkdir -p release/linux/arm64
                          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
                            -ldflags="-s -w -X main.version=1.0.1+<+codebase.shortCommitSha>" \
                            -o release/linux/arm64/qtest-publisher .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish immutable child
                      identifier: publish_immutable_child
                      timeout: 30m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/qtest-publisher
                        tags: [1.0.1-linux-arm64-r2]
                        dockerfile: docker/Dockerfile.linux.arm64
                        context: .
                        caching: false
        - stage:
            name: Publish Windows LTSC 2019
            identifier: publish_windows_ltsc2019
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "tag"
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: <+pipeline.variables.windows2019BuilderPool>
                    os: Windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build verified static binary
                      identifier: build_verified_static_binary
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: mcr.microsoft.com/windows/servercore@sha256:bea74690d808bba3e6b0d4ba4c599305aea1f66c875f133f1e75855841dcb1d5
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '17763') { throw "Expected Windows build 17763, got $actual" }
                          Invoke-WebRequest -UseBasicParsing -Uri '<+pipeline.variables.goWindowsUrl>' -OutFile go.zip
                          if ((Get-FileHash -Algorithm SHA256 go.zip).Hash.ToLowerInvariant() -ne '<+pipeline.variables.goWindowsSha256>') { throw 'Go SDK SHA-256 mismatch' }
                          Expand-Archive go.zip -DestinationPath C:\tools -Force
                          New-Item -ItemType Directory -Force release\windows\amd64 | Out-Null
                          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
                          & C:\tools\go\bin\go.exe build -trimpath -ldflags '-s -w -X main.version=1.0.1+<+codebase.shortCommitSha>' -o release\windows\amd64\qtest-publisher.exe .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish immutable child
                      identifier: publish_immutable_child
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/qtest-publisher
                        tags: [1.0.1-windows-ltsc2019-amd64-r2]
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2019
                        context: .
                        caching: false
              delegateSelectors: [windows-vm]
        - stage:
            name: Publish Windows LTSC 2022
            identifier: publish_windows_ltsc2022
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "tag"
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              runtime: {type: Cloud, spec: {}}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build verified static binary
                      identifier: build_verified_static_binary
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: mcr.microsoft.com/windows/servercore@sha256:e10503b9a4f7faafa30aa0f5d0e8e7f7ca30a4496b3b87d61178b4d7c6815fb5
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '20348') { throw "Expected Windows build 20348, got $actual" }
                          Invoke-WebRequest -UseBasicParsing -Uri '<+pipeline.variables.goWindowsUrl>' -OutFile go.zip
                          if ((Get-FileHash -Algorithm SHA256 go.zip).Hash.ToLowerInvariant() -ne '<+pipeline.variables.goWindowsSha256>') { throw 'Go SDK SHA-256 mismatch' }
                          Expand-Archive go.zip -DestinationPath C:\tools -Force
                          New-Item -ItemType Directory -Force release\windows\amd64 | Out-Null
                          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
                          & C:\tools\go\bin\go.exe build -trimpath -ldflags '-s -w -X main.version=1.0.1+<+codebase.shortCommitSha>' -o release\windows\amd64\qtest-publisher.exe .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish immutable child
                      identifier: publish_immutable_child
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/qtest-publisher
                        tags: [1.0.1-windows-ltsc2022-amd64-r2]
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2022
                        context: .
                        caching: false
        - stage:
            name: Publish Windows LTSC 2025
            identifier: publish_windows_ltsc2025
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "tag"
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: <+pipeline.variables.windows2025BuilderPool>
                    os: Windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build verified static binary
                      identifier: build_verified_static_binary
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: mcr.microsoft.com/windows/servercore@sha256:22505496dd4229dba63453ba0c6dc31c06fd3e11810e5b8e429aa6b16dab2457
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '26100') { throw "Expected Windows build 26100, got $actual" }
                          Invoke-WebRequest -UseBasicParsing -Uri '<+pipeline.variables.goWindowsUrl>' -OutFile go.zip
                          if ((Get-FileHash -Algorithm SHA256 go.zip).Hash.ToLowerInvariant() -ne '<+pipeline.variables.goWindowsSha256>') { throw 'Go SDK SHA-256 mismatch' }
                          Expand-Archive go.zip -DestinationPath C:\tools -Force
                          New-Item -ItemType Directory -Force release\windows\amd64 | Out-Null
                          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
                          & C:\tools\go\bin\go.exe build -trimpath -ldflags '-s -w -X main.version=1.0.1+<+codebase.shortCommitSha>' -o release\windows\amd64\qtest-publisher.exe .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish immutable child
                      identifier: publish_immutable_child
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/qtest-publisher
                        tags: [1.0.1-windows-ltsc2025-amd64-r2]
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2025
                        context: .
                        caching: false
              delegateSelectors: [windows-vm]
  allowStageExecutions: true
