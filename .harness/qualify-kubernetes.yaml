pipeline:
  name: qTest Publisher - KubernetesDirect Qualification-dm
  identifier: qtest_publisher_qualify_kubernetes_dm
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: dmgitcon
        repoName: qtest-plugin-images
        build: <+input>
  variables:
    - {name: dockerConnector, type: String, value: dmdockerconn}
    - {name: linuxAmd64KubernetesConnector, type: String, value: gcopdmlinuxamd64}
    - {name: linuxArm64KubernetesConnector, type: String, value: gcopdmarm64}
    - {name: namespace, type: String, value: cie-test}
    - {name: linuxAmd64Candidate, type: String, value: <+input>}
    - {name: linuxArm64Candidate, type: String, value: <+input>}
    - {name: windows2019Candidate, type: String, value: <+input>}
    - {name: windows2022Candidate, type: String, value: <+input>}
    - {name: windows2025Candidate, type: String, value: <+input>}
    - {name: qtestUrl, type: String, value: <+input>}
    - {name: qtestToken, type: Secret, value: <+input>}
    - {name: qtestProjectId, type: String, value: <+input>}
    - {name: qtestCycleId, type: String, value: <+input>}
  stages:
    - stage:
        name: Refuse mutable candidates
        identifier: refuse_mutable_candidates
        type: CI
        spec:
          cloneCodebase: true
          platform: {os: Linux, arch: Amd64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
              - step:
                  type: Run
                  name: Require five digest-pinned candidates
                  identifier: require_digest_pins
                  spec:
                    connectorRef: <+pipeline.variables.dockerConnector>
                    image: docker.io/library/python:3.13.7-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
                    shell: Sh
                    envVariables:
                      CANDIDATES: <+pipeline.variables.linuxAmd64Candidate>,<+pipeline.variables.linuxArm64Candidate>,<+pipeline.variables.windows2019Candidate>,<+pipeline.variables.windows2022Candidate>,<+pipeline.variables.windows2025Candidate>
                    command: |
                      python3 scripts/release.py validate-lock
                      python3 - <<'PY'
                      import json
                      import os
                      import re
                      candidates = os.environ["CANDIDATES"].split(",")
                      platforms = [
                          "linux-amd64",
                          "linux-arm64",
                          "windows-amd64-ltsc2019",
                          "windows-amd64-ltsc2022",
                          "windows-amd64-ltsc2025",
                      ]
                      pattern = re.compile(r"^[^@\s]+@sha256:[0-9a-f]{64}$")
                      if len(candidates) != 5 or any(not pattern.fullmatch(item) for item in candidates):
                          raise SystemExit("all five candidate images must be pinned by digest")
                      lock = json.load(open("locks/platform-child-digests.json"))
                      for platform, candidate in zip(platforms, candidates):
                          child = lock["children"][platform]
                          expected_candidate = f"{lock['repository']}@{child['digest']}"
                          expected_production = (
                              f"{lock['production_repository']}@{child['digest']}"
                          )
                          normalized = candidate.removeprefix("docker.io/")
                          candidate_matches = (
                              child["published"] and normalized == expected_candidate
                          )
                          production_matches = (
                              child["promoted"] and normalized == expected_production
                          )
                          if not candidate_matches and not production_matches:
                              raise SystemExit(
                                  f"{platform} image does not match the published/promoted "
                                  f"digest lock: {normalized}"
                              )
                      PY
    - parallel:
        - stage:
            name: Qualify Linux AMD64
            identifier: qualify_linux_amd64
            type: CI
            spec:
              cloneCodebase: true
              platform: {os: Linux, arch: Amd64}
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: <+pipeline.variables.linuxAmd64KubernetesConnector>
                  namespace: <+pipeline.variables.namespace>
                  automountServiceAccountToken: true
                  serviceAccountName: ci-image-e2e-reader
                  nodeSelector: {kubernetes.io/arch: amd64}
              execution:
                steps:
                  - step:
                      type: Plugin
                      name: Empty result contract
                      identifier: empty_result_contract
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxAmd64Candidate>
                        settings:
                          qtest_url: https://unused.qtestnet.com
                          bearer_token: not-used-for-empty-result
                          project_id: "1"
                          destination_type: test-cycle
                          destination_id: "1"
                          result_paths: no-results/**/*.xml
                          empty_result: warn
                  - step:
                      type: Plugin
                      name: Expected operational failure
                      identifier: expected_operational_failure
                      failureStrategies:
                        - onFailure:
                            errors: [AllErrors]
                            action: {type: Ignore}
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxAmd64Candidate>
                        settings:
                          qtest_url: https://127.0.0.1:1
                          bearer_token: expected-failure-only
                          project_id: "1"
                          destination_type: test-cycle
                          destination_id: "1"
                          result_paths: tests/fixtures/junit/*.xml
                          timeout: 5s
                  - step:
                      type: Plugin
                      name: Publish sandbox JUnit
                      identifier: publish_sandbox_junit
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxAmd64Candidate>
                        settings:
                          qtest_url: <+pipeline.variables.qtestUrl>
                          bearer_token: <+pipeline.variables.qtestToken>
                          project_id: <+pipeline.variables.qtestProjectId>
                          destination_type: test-cycle
                          destination_id: <+pipeline.variables.qtestCycleId>
                          suite_name: qtest-qualification-linux-amd64
                          reuse_suite: "true"
                          result_paths: tests/fixtures/junit/*.xml
                          identity_mode: method
                  - step:
                      type: Run
                      name: Assert running image digest
                      identifier: assert_running_image_digest
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: docker.io/library/python:3.13.7-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
                        shell: Sh
                        envVariables:
                          CANDIDATE_IMAGE: <+pipeline.variables.linuxAmd64Candidate>
                          POD_NAMESPACE: <+pipeline.variables.namespace>
                          EXPECTED_FAILURE_STATUS: <+execution.steps.expected_operational_failure.status>
                        command: |
                          test "$EXPECTED_FAILURE_STATUS" != Succeeded
                          python3 scripts/assert_kubernetes_image.py
        - stage:
            name: Qualify Linux ARM64
            identifier: qualify_linux_arm64
            type: CI
            spec:
              cloneCodebase: true
              platform: {os: Linux, arch: Arm64}
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: <+pipeline.variables.linuxArm64KubernetesConnector>
                  namespace: <+pipeline.variables.namespace>
                  automountServiceAccountToken: true
                  serviceAccountName: ci-image-e2e-reader
                  nodeSelector: {kubernetes.io/arch: arm64}
                  tolerations:
                    - {effect: NoSchedule, key: kubernetes.io/arch, operator: Equal, value: arm64}
              execution:
                steps:
                  - step:
                      type: Plugin
                      name: Empty result contract
                      identifier: empty_result_contract
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxArm64Candidate>
                        settings:
                          qtest_url: https://unused.qtestnet.com
                          bearer_token: not-used-for-empty-result
                          project_id: "1"
                          destination_type: test-cycle
                          destination_id: "1"
                          result_paths: no-results/**/*.xml
                          empty_result: warn
                  - step:
                      type: Plugin
                      name: Expected operational failure
                      identifier: expected_operational_failure
                      failureStrategies:
                        - onFailure:
                            errors: [AllErrors]
                            action: {type: Ignore}
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxArm64Candidate>
                        settings:
                          qtest_url: https://127.0.0.1:1
                          bearer_token: expected-failure-only
                          project_id: "1"
                          destination_type: test-cycle
                          destination_id: "1"
                          result_paths: tests/fixtures/junit/*.xml
                          timeout: 5s
                  - step:
                      type: Plugin
                      name: Publish sandbox JUnit
                      identifier: publish_sandbox_junit
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.linuxArm64Candidate>
                        settings:
                          qtest_url: <+pipeline.variables.qtestUrl>
                          bearer_token: <+pipeline.variables.qtestToken>
                          project_id: <+pipeline.variables.qtestProjectId>
                          destination_type: test-cycle
                          destination_id: <+pipeline.variables.qtestCycleId>
                          suite_name: qtest-qualification-linux-arm64
                          reuse_suite: "true"
                          result_paths: tests/fixtures/junit/*.xml
                          identity_mode: class
                  - step:
                      type: Run
                      name: Assert running image digest
                      identifier: assert_running_image_digest
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: docker.io/library/python:3.13.7-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
                        shell: Sh
                        envVariables:
                          CANDIDATE_IMAGE: <+pipeline.variables.linuxArm64Candidate>
                          POD_NAMESPACE: <+pipeline.variables.namespace>
                          EXPECTED_FAILURE_STATUS: <+execution.steps.expected_operational_failure.status>
                        command: |
                          test "$EXPECTED_FAILURE_STATUS" != Succeeded
                          python3 scripts/assert_kubernetes_image.py
        - stage:
            name: Qualify Windows LTSC 2019
            identifier: qualify_windows_ltsc2019
            type: CI
            spec:
              cloneCodebase: true
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: gcopdmwindowsbuildfarm
                  namespace: <+pipeline.variables.namespace>
                  os: Windows
                  automountServiceAccountToken: true
                  serviceAccountName: ci-image-e2e-reader
                  nodeSelector:
                    kubernetes.io/os: windows
                    node.kubernetes.io/windows-build: "10.0.17763"
                  tolerations:
                    - {effect: NoSchedule, key: node.kubernetes.io/os, operator: Equal, value: windows}
              execution:
                steps:
                  - step:
                      type: Plugin
                      name: Empty result contract
                      identifier: empty_result_contract
                      spec:
