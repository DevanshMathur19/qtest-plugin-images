                          bearer_token: <+pipeline.variables.qtestToken>
                          project_id: <+pipeline.variables.qtestProjectId>
                          destination_type: test-cycle
                          destination_id: <+pipeline.variables.qtestCycleId>
                          suite_name: qtest-qualification-windows-ltsc2019
                          reuse_suite: "true"
                          result_paths: tests/fixtures/junit/*.xml
                          identity_mode: method
                  - step:
                      type: Run
                      name: Assert runtime and image digest
                      identifier: assert_runtime_image_digest
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: mcr.microsoft.com/windows/servercore@sha256:bea74690d808bba3e6b0d4ba4c599305aea1f66c875f133f1e75855841dcb1d5
                        shell: Powershell
                        envVariables:
                          CANDIDATE_IMAGE: <+pipeline.variables.windows2019Candidate>
                          POD_NAMESPACE: <+pipeline.variables.namespace>
                          EXPECTED_WINDOWS_BUILD: "17763"
                          EXPECTED_FAILURE_STATUS: <+execution.steps.expected_operational_failure.status>
                        command: |
                          if ($env:EXPECTED_FAILURE_STATUS -eq 'Succeeded') { throw 'expected operational failure unexpectedly succeeded' }
                          powershell -File scripts/assert-kubernetes-image.ps1
